<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Estimate request form</title>
  </head>
  <body>
    <form hidden name="estimate-request" method="POST" data-netlify="true" data-netlify-honeypot="website">
      <input type="hidden" name="form-name" value="estimate-request" />
      <input name="website" />
      <input name="name" />
      <input name="company" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="service"><option>Not sure yet</option></select>
      <input name="location" />
      <textarea name="message"></textarea>
      <button type="submit">Send</button>
    </form>
  </body>
</html>
